[package]
name = "rid-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
odid = { path = "../../crates/odid" }
rid-proto = { path = "../../crates/rid-proto" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios", "fs"] }
